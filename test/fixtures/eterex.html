<!--
  Eterex-shaped fixture.

  FOUR price locations in TWO digit systems — verified live, both styles in use
  at the same time:
      hero / input   268,400      Latin, ASCII comma
      rate / stat    ۲۶۸٬۴۰۰      Persian digits, U+066C

  THE POINT OF THE HERO BLOCK. Every span on the price line carries inline
  `color: transparent`, `-webkit-text-fill-color: transparent` and
  `background-clip: text`, with the colour supplied by a gradient. In a captured
  DOM that gradient serialises as an EMPTY `background-image: ;`, which reads as
  though the digits paint nothing — i.e. as though the price were hidden behind
  transparency. Resolved in a real browser it is a live gradient, the glyphs
  paint through it, and the price is plainly visible:

      color                   → rgba(0, 0, 0, 0)
      -webkit-text-fill-color → rgba(0, 0, 0, 0)
      background-image        → linear-gradient(...)
      background-clip         → text

  So the gradient IS written here, in its resolved form, because a fixture cannot
  execute the site's runtime CSS that produces it. This fixture therefore
  represents the RENDERED page, not the capture — and the capture artifact is
  documented in the adapter and the README rather than reproduced here, because
  reproducing it would make the fixture assert something false about the site.

  THE CLASS COLLISION. The hero's `1` (the USDT quantity) carries a class list
  BYTE-IDENTICAL to the price span's. Nothing here may be found by class.
-->
